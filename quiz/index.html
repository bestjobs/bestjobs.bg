<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивна Подготовка за Медицински Университети с BestJobs.BG</title>
    <link rel="canonical" href="https://bestjobs.bg/quiz/">
    <meta property="og:url" content="https://bestjobs.bg/quiz/">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="print-area"></div>
    <main class="container">
        <h1>Интерактивна Подготовка за Медицински Университети с BestJobs.BG</h1>
        <section id="setup-menu" class="menu-box">
            <div>
                <label for="university-select">Изберете университет:</label>
                <select id="university-select">
                    <option value="sofia">МУ - София</option>
                    <option value="varna">МУ - Варна</option>
                    <option value="plovdiv">МУ - Пловдив</option>
                    <option value="pleven">МУ - Плевен</option>
                </select>
            </div>
            <div>
                <label for="subject-select" style="margin-top:15px; display:block;">Изберете предмет:</label>
                <select id="subject-select">
                    <option value="biology">Биология</option>
                    <option value="chemistry">Химия</option>
                </select>
            </div>
            <div style="margin-top: 20px;">
                <button onclick="initStaticQuiz()">🎬 Старт на изпита</button>
                <button id="g-pdf" onclick="printAllLectures()" style="background:#334155; display:none;">📋 Запиши (PDF)</button>
            </div>
        </section>
        <div id="crypto-status-indicator"></div>
        <div id="quiz-space"></div>
    </main>
    <footer>
        <a href="https://bestjobs.bg/quiz/" title="HOME">bestjobs.bg/quiz/</a> &copy; 2026
    </footer>
    <script src="app.js"></script>
</body>
</html>
