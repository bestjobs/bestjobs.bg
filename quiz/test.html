<!DOCTYPE html>
<html lang="bg">
<head><meta charset="UTF-8"><title>Крипто Синхронизатор</title></head>
<body>
    <h2>Генериране на синхронизиран файл db_sofia.js...</h2>
    <p id="status">Моля, изчакайте изчисляването на AES-256-GCM матрицата...</p>

    <script>
        const pass = "BestJobsBG_Sec_GCM_2027_v2#9fA3kX8pQ2mL5zW";
        
        async function encryptGCM(text, password) {
            const enc = new TextEncoder();
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
            const key = await window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
            const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(text));
            return { enc: btoa(String.fromCharCode(...new Uint8Array(ciphertext))), salt: btoa(String.fromCharCode(...salt)), iv: btoa(String.fromCharCode(...iv)) };
        }

        async function startSync() {
            const db = { biology: [], chemistry: [] };
            
            // Тестов въпрос с ФИКСИРАНИ отговори (Третият е верен)
            const topicMeta = await encryptGCM("Съединителна тъкан", pass);
            const qEnc = await encryptGCM("Коя от посочените разновидности НЕ е вид съединителна тъкан?", pass);
            const sEnc = await encryptGCM("🧬 Развита теория за съединителната тъкан...", pass);
            
            const rawOpts = ["Хрущялна тъкан", "Костна тъкан", "Епителна тъкан", "Мастна тъкан"];
            const opts = [];
            
            for(let i = 0; i < 4; i++) {
                const optEnc = await encryptGCM(rawOpts[i], pass);
                opts.push({ x: optEnc.enc, c: i === 2, r: "Пояснение към отговора" }); // Третият (индекс 2) е верен
            }

            db.biology.push({ salt: topicMeta.salt, iv: topicMeta.iv, t: topicMeta.enc, q: qEnc.enc, k: true, s: sEnc.enc, o: opts });

            const blob = new Blob(["var quizDatabase = " + JSON.stringify(db) + ";"], { type: "application/javascript" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "db_sofia.js";
            a.click();
            document.getElementById("status").innerText = "✅ Файлът db_sofia.js беше генериран успешно! Заменете стария файл в хранилището си с новоизтегления.";
        }

        startSync();
    </script>
</body>
</html>
