<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES-256-GCM Интелигентен Мулти-Генератор | BestJobs.BG</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --correct-border: #10b981;
            --correct-bg: #f0fdf4;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; -webkit-font-smoothing: antialiased; }
        .container { max-width: 800px; margin: 0 auto; box-sizing: border-box; }
        .main-card { background: var(--surface); padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); font-size: 1.6rem; text-align: center; margin: 0 0 5px 0; font-weight: 800; }
        p.subtitle { font-size: 0.9rem; color: #64748b; text-align: center; margin: 0 0 30px 0; }
        
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        label { font-weight: 700; display: block; margin-top: 15px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; }
        .grid-3 label { margin-top: 0; }
        
        input, select, textarea { width: 100%; padding: 12px 14px; margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; color: var(--text); background: var(--surface); outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
        textarea { height: 120px; font-family: inherit; resize: vertical; }
        
        .import-zone { background: #f1f5f9; border: 2px dashed #94a3b8; padding: 20px; border-radius: 8px; margin-top: 20px; margin-bottom: 10px; }
        
        .q-wrapper { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--primary); padding: 25px; border-radius: 8px; margin-top: 25px; position: relative; }
        .remove-btn { position: absolute; top: 20px; right: 20px; background: var(--danger); color: white; padding: 8px 14px; font-size: 0.8rem; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
        .remove-btn:hover { background: var(--danger-hover); }
        
        .opt-box { border-left: 4px solid var(--border); padding-left: 15px; margin-top: 14px; padding-top: 2px; padding-bottom: 2px; }
        .opt-box.is-correct { border-left-color: var(--correct-border); background: var(--correct-bg); padding: 14px; border-radius: 6px; }
        
        .action-btn { background: #334155; color: white; padding: 14px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 0.95rem; margin-right: 10px; }
        .action-btn:hover { background: #1e293b; }
        .download-btn { background: var(--primary); color: white; padding: 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 35px; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.025em; }
        .download-btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <h1>🛡️ Военен Мулти-Криптогенератор за Справочници</h1>
        <p class="subtitle">Интелигентен модул за групово извличане, попълване и кодиране на съдържание.</p>

        <div class="grid-3">
            <div>
                <label for="enc-key">🔑 Лицензен Мастер Ключ</label>
                <input type="text" id="enc-key" value="BestJobsBG_Military_Crypto_Key_2027">
            </div>
            <div>
                <label for="uni-filename">💾 Справочник (Обща Книга)</label>
                <select id="uni-filename">
                    <option value="db_sofia.js">Книга за МУ — София (Биология + Химия)</option>
                    <option value="db_varna.js">Книга за МУ — Варна (Биология + Химия)</option>
                    <option value="db_plovdiv.js">Книга за МУ — Пловдив (Биология + Химия)</option>
                    <option value="db_pleven.js">Книга за МУ — Плевен (Биология + Химия)</option>
                    <option value="db_stara-zagora.js">Книга за Тракийски У (Биология + Химия)</option>
                    <option value="db_burgas.js">Книга за У — Бургас (Биология + Химия)</option>
                    <option value="db_su.js">Книга за СУ (Биология + Химия)</option>
                </select>
            </div>
            <div>
                <label for="subject-select">📚 Текущ изпитен раздел</label>
                <select id="subject-select">
                    <option value="biology">Биология (Профил)</option>
                    <option value="chemistry">Химия (Обща и Органична)</option>
                </select>
            </div>
        </div>

        <div class="import-zone">
            <h3 style="margin-top:0; color:#334155; font-size:1.1rem;">📥 Групово зареждане от Текст, Word или PDF</h3>
            <p style="font-size:0.85rem; color:#475569; margin:0 0 10px 0;">Качете <code>.txt</code> файл <b>ИЛИ</b> поставете суровия копиран текст от справочника директно в текстовото поле:</p>
            <input type="file" id="txt-file-input" accept=".txt" onchange="importFromTxtFile(this)" style="background:transparent; border:none; padding:0; margin-bottom:12px; font-size:0.85rem;">
            <textarea id="bulk-text-input" placeholder="Поставете структурирания текст тук..."></textarea>
            <button type="button" class="action-btn" style="background:#0f766e; margin-top:12px; width:100%; justify-content:center;" onclick="parseBulkText()">⚡ Автоматично разчитане и парсване</button>
        </div>

        <div id="questions-container"></div>
        <div style="margin-top:20px;">
            <button type="button" class="action-btn" onclick="addNewQuestionCard()">➕ Ръчно добавяне на въпрос</button>
        </div>
        
        <button type="button" class="download-btn" onclick="generateAndDownloadCryptoDB()">🔒 Криптирай справочника и изтегли файл</button>
    </div>
</div>

<script>
    let questionCounter = 0;

    window.onload = function() {
        addNewQuestionCard();
    };

    function addNewQuestionCard(data = null) {
        questionCounter++;
        const container = document.getElementById('questions-container');
        const card = document.createElement('div');
        card.className = 'q-wrapper';
        card.id = `q-card-${questionCounter}`;
        
        const topicVal = data ? data.topic : "";
        const qVal = data ? data.question : "";
        const theoryVal = data ? data.theory : "";
        const hasTheory = data && data.theory ? "true" : "false";
        
        let optsHTML = "";
        for(let i = 1; i <= 4; i++) {
            const isCorrectClass = i === 1 ? "is-correct" : "";
            const colorLbl = i === 1 ? "var(--correct-border)" : "var(--danger)";
            const statusText = i === 1 ? "ВЕРЕН" : "ГРЕШЕН";
            
            const optText = data && data.options[i-1] ? data.options[i-1].text : "";
            const optReason = data && data.options[i-1] ? data.options[i-1].reason : "";

            optsHTML += `
                <div class="opt-box ${isCorrectClass}">
                    <span style="color:${colorLbl}; font-weight:700; font-size:0.8rem; letter-spacing:0.05em;">ОТГОВОР ${i} (${statusText}):</span>
                    <input type="text" class="opt-${i}-text" value="${optText}" placeholder="напр. ${i}. Текст на отговора" required>
                    <input type="text" class="opt-${i}-reason" value="${optReason}" placeholder="Обяснение" required>
                </div>`;
        }

        card.innerHTML = `
            <button type="button" class="remove-btn" onclick="removeQuestionCard(${questionCounter})">Премахни</button>
            <h3 style="margin-top:0; color:var(--primary); font-size:1.1rem; font-weight:800;">Въпрос №${questionCounter}</h3>
            
            <label>📌 Изпитна Тема / Раздел от Справочника</label>
            <input type="text" class="q-topic" value="${topicVal}" placeholder="Въведете раздел" required>
            
            <label>❓ Текст на Изпитния Въпрос</label>
            <input type="text" class="q-text" value="${qVal}" placeholder="Въведете въпрос" required>
            
            <label>💡 Теоретичен Конспект (Лекционен материал)</label>
            <select class="has-theory" onchange="toggleTheoryField(this)">
                <option value="true" ${hasTheory === "true" ? "selected" : ""}>Да, прикачи развита тема</option>
                <option value="false" ${hasTheory === "false" ? "selected" : ""}>Не, без развита тема</option>
            </select>
            
            <div class="theory-field-wrapper" style="display: ${hasTheory === "true" ? "block" : "none"}">
                <label>📖 Текст на развитата тема (Поддържа HTML5 & латински курсив)</label>
                <textarea class="q-theory" placeholder="Въведете конспект...">${theoryVal}</textarea>
            </div>
            
            <label style="margin-top:20px; border-bottom:1px solid var(--border); padding-bottom:5px;">📝 Варианти за отговор:</label>
            ${optsHTML}
        `;
        container.appendChild(card);
    }

    function removeQuestionCard(id) { const card = document.getElementById(`q-card-${id}`); if (card) card.remove(); }
    function toggleTheoryField(selectEl) { selectEl.nextElementSibling.style.display = (selectEl.value === "true") ? "block" : "none"; }

    function parseBulkText() {
        const text = document.getElementById('bulk-text-input').value;
        if(!text.trim()) { alert("Полето е празно!"); return; }

        const blocks = text.split(/Въпрос:/i);
        let defaultTopic = "Общ изпитен раздел";
        
        if(text.toLowerCase().includes("тема:")) {
            const topicMatch = text.match(/тема:\s*(.*)/i);
            if(topicMatch) defaultTopic = topicMatch[1].split('\n')[0].trim();
        }

        let addedCount = 0;

        for(let i = 1; i < blocks.length; i++) {
            const block = blocks[i].trim();
            const lines = block.split('\n').map(l => l.trim()).filter(l => l);
            if(lines.length < 2) continue;

            let questionText = lines[0];
            let options = [];
            let theoryText = "";
            let catchingTheory = false;

            for(let j = 1; j < lines.length; j++) {
                const line = lines[j];
                
                if(line.toLowerCase().startsWith("теория:") || line.toLowerCase().startsWith("конспект:")) {
                    catchingTheory = true;
                    theoryText += line.replace(/теория:|конспект:/i, "").trim() + "<br>";
                    continue;
                }
                
                if(catchingTheory) {
                    theoryText += line + "<br>";
                    continue;
                }

                const optParts = line.split('|');
                const textPart = optParts[0] ? optParts[0].trim() : `Вариант ${options.length + 1}`;
                const reasonPart = optParts[1] ? optParts[1].trim() : "Валидация по официален медицински стандарт.";

                options.push({ text: textPart, reason: reasonPart });
            }

            while(options.length < 4) {
                options.push({ text: `${options.length + 1}. Празен вариант (Системно попълнен)`, reason: "Невярна опция." });
            }

            addNewQuestionCard({
                topic: defaultTopic,
                question: questionText,
                theory: theoryText.trim(),
                options: options
            });
            addedCount++;
        }

        if(addedCount > 0) {
            alert(`🎉 Успешно разчетени, разделени и заредени ${addedCount} въпроса на екрана!`);
            document.getElementById('bulk-text-input').value = "";
        } else {
            alert("❌ Системата не разпозна формата на текста. Проверете документацията.");
        }
    }
    function importFromTxtFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('bulk-text-input').value = e.target.result;
            parseBulkText();
        };
        reader.readAsText(file, "UTF-8");
    }

    // 🛡️ Нативен криптографски модул (Web Crypto API AES-256-GCM)
    async function encryptGCM(text, password) {
        if (!text) return { enc: "", salt: "", iv: "" };
        const enc = new TextEncoder();
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
        );
        const key = await window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt"]
        );
        const ciphertext = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv }, key, enc.encode(text)
        );

        return {
            enc: btoa(String.fromCharCode(...new Uint8Array(ciphertext))),
            salt: btoa(String.fromCharCode(...salt)),
            iv: btoa(String.fromCharCode(...iv))
        };
    }

    async function generateAndDownloadCryptoDB() {
        const pass = document.getElementById('enc-key').value;
        const filename = document.getElementById('uni-filename').value;
        const subject = document.getElementById('subject-select').value;
        const cards = document.getElementsByClassName('q-wrapper');
        
        if (cards.length === 0) { alert("Моля попълнете или генерирайте карти на екрана!"); return; }
        if (!pass) { alert("Лицензният Мастер Ключ е задължителен за шифрирането!"); return; }

        const encryptedQuestionsList = [];

        for (let card of cards) {
            const topic = card.querySelector('.q-topic').value.trim();
            const question = card.querySelector('.q-text').value.trim();
            const hasTheory = card.querySelector('.has-theory').value === "true";
            const theory = card.querySelector('.q-theory').value.trim();
            
            if (!topic || !question) { alert("Имате непопълнени теми или въпроси!"); return; }

            const topicMeta = await encryptGCM(topic, pass);
            const qEnc = await encryptGCM(question, pass);
            const sEnc = hasTheory ? await encryptGCM(theory, pass) : { enc: "" };
            const optionsArr = [];

            for (let i = 1; i <= 4; i++) {
                const txt = card.querySelector(`.opt-${i}-text`).value.trim();
                const reas = card.querySelector(`.opt-${i}-reason`).value.trim();
                
                if (txt) {
                    const txtEnc = await encryptGCM(txt, pass);
                    const reasEnc = await encryptGCM(reas, pass);
                    optionsArr.push({
                        x: txtEnc.enc,
                        c: (i === 1), // Първият отговор (Опция 1) винаги се маркира за верен
                        r: reasEnc.enc
                    });
                }
            }

            encryptedQuestionsList.push({
                salt: topicMeta.salt,
                iv: topicMeta.iv,
                t: topicMeta.enc,
                q: qEnc.enc,
                k: hasTheory,
                s: sEnc.enc,
                o: optionsArr
            });
        }
        
        const finalDatabaseStructure = { biology: [], chemistry: [] };
        finalDatabaseStructure[subject] = encryptedQuestionsList;
        
        const blob = new Blob(
            ["var quizDatabase = " + JSON.stringify(finalDatabaseStructure) + ";"], 
            { type: "application/javascript;charset=utf-8" }
        );
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
    }
</script>
<footer><a href="/" title="HOME">bestjobs.bg</a> &copy; 2026</footer>
</body>
</html>
